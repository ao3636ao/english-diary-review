<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#087ee5" />
    <meta
      name="description"
      content="英語日記と日常のフレーズを、日本語から声に出して復習。データはあなたの端末内に保存します。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>PLAY BACK — 英語日記・フレーズ復習</title>
    <link
      rel="icon"
      href="./assets/playback-icon-96.png"
      type="image/png"
      sizes="96x96"
    />
    <link rel="apple-touch-icon" href="./assets/playback-icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="#home" aria-label="PLAY BACK ホーム">
          <img
            class="brand-wordmark"
            src="./assets/playback-wordmark.png"
            alt="PLAY BACK"
            width="1086"
            height="699"
          />
        </a>
        <span class="app-description">英語日記・フレーズ復習</span>
        <div class="header-actions">
          <span id="connection" class="connection">端末内に保存</span
          ><button
            type="button"
            class="button small secondary"
            data-action="backup"
          >
            バックアップ
          </button>
        </div>
      </div>
    </header>
    <div id="backup-status" class="backup-status" aria-live="polite"></div>
    <div id="update-banner" class="update-banner" hidden>
      新しいバージョンがあります。<button
        type="button"
        class="button small"
        data-action="update-app"
      >
        更新する
      </button>
    </div>
    <main id="main" tabindex="-1">
      <p class="loading">データを読み込んでいます…</p>
    </main>
    <nav class="bottom-nav" aria-label="メインメニュー">
      <a href="#home" data-view="home"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7" /></svg
        >ホーム</a
      >
      <a href="#study" data-view="study"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m8 4 12 8-12 8zM3 4v16" /></svg
        >復習</a
      >
      <a href="#library" data-view="library"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="1" />
          <path d="M8 8h8M8 12h8M8 16h5" /></svg
        >一覧</a
      >
      <a href="#add" data-view="add"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v18M3 12h18" /></svg
        >追加</a
      >
      <a href="#stats" data-view="stats"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 3v18h17M8 16v-4M13 16V8M18 16V4" /></svg
        >記録</a
      >
      <a href="#settings" data-view="settings"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
          <circle cx="9" cy="6" r="2" />
          <circle cx="16" cy="12" r="2" />
          <circle cx="8" cy="18" r="2" /></svg
        >設定</a
      >
    </nav>
    <div
      id="notice"
      class="notice"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message" class="preserve"></p>
        <div class="actions">
          <button class="button secondary" value="cancel">キャンセル</button
          ><button id="confirm-yes" class="button danger" value="confirm">
            実行する
          </button>
        </div>
      </form>
    </dialog>
    <noscript
      >このアプリにはJavaScriptが必要です。Chromeの設定でJavaScriptを有効にしてください。</noscript
    >
  </body>
</html>
