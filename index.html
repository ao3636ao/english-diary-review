<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#193f36" />
    <meta
      name="description"
      content="英語日記と日常のフレーズを、日本語から声に出して復習。データはあなたの端末内に保存します。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>ことばのノート — 英語日記・フレーズ復習</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="app-header">
      <a class="brand" href="#home" aria-label="ことばのノート ホーム"
        ><img src="./icons/icon.svg" alt="" width="36" height="36" /><span
          >ことばのノート<small>英語日記・フレーズ復習</small></span
        ></a
      >
      <div class="header-actions">
        <span id="connection" class="connection">端末内に保存</span
        ><button
          type="button"
          class="button small secondary"
          data-action="backup"
        >
          バックアップ
        </button>
      </div>
    </header>
    <div id="backup-status" class="backup-status" aria-live="polite"></div>
    <div id="update-banner" class="update-banner" hidden>
      新しいバージョンがあります。<button
        type="button"
        class="button small"
        data-action="update-app"
      >
        更新する
      </button>
    </div>
    <main id="main" tabindex="-1">
      <p class="loading">ノートを開いています…</p>
    </main>
    <nav class="bottom-nav" aria-label="メインメニュー">
      <a href="#home" data-view="home"
        ><span aria-hidden="true">⌂</span>ホーム</a
      >
      <a href="#study" data-view="study"
        ><span aria-hidden="true">▻</span>復習</a
      >
      <a href="#library" data-view="library"
        ><span aria-hidden="true">▤</span>一覧</a
      >
      <a href="#add" data-view="add"><span aria-hidden="true">＋</span>追加</a>
      <a href="#stats" data-view="stats"
        ><span aria-hidden="true">▥</span>記録</a
      >
      <a href="#settings" data-view="settings"
        ><span aria-hidden="true">⚙</span>設定</a
      >
    </nav>
    <div
      id="notice"
      class="notice"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message" class="preserve"></p>
        <div class="actions">
          <button class="button secondary" value="cancel">キャンセル</button
          ><button id="confirm-yes" class="button danger" value="confirm">
            実行する
          </button>
        </div>
      </form>
    </dialog>
    <noscript
      >このアプリにはJavaScriptが必要です。Chromeの設定でJavaScriptを有効にしてください。</noscript
    >
  </body>
</html>
